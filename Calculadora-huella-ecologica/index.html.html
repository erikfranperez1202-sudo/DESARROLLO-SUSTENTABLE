<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de huella ecológica</title>
<style>
  :root {
    --verde-oscuro: #1b4332;
    --verde: #2d6a4f;
    --verde-claro: #95d5b2;
    --verde-fondo: #eaf5ec;
    --tierra: #7f5539;
    --azul: #2a7f9e;
    --blanco: #ffffff;
    --texto: #1f2d24;
    --borde: #cfe3d4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    color: var(--texto);
    background: linear-gradient(180deg, #d8f0df 0%, var(--verde-fondo) 40%, #f6fbf6 100%);
    min-height: 100vh;
    line-height: 1.5;
  }
  header {
    background: linear-gradient(135deg, var(--verde-oscuro), var(--verde) 60%, var(--azul));
    color: var(--blanco);
    text-align: center;
    padding: 2.5rem 1rem 3rem;
  }
  header h1 { margin: 0 0 .6rem; font-size: clamp(1.7rem, 5vw, 2.6rem); }
  header p { margin: 0 auto; max-width: 620px; font-size: 1.05rem; opacity: .95; }
  .icono { font-size: 2.6rem; display: block; margin-bottom: .3rem; }
  main { max-width: 760px; margin: -1.6rem auto 2rem; padding: 0 1rem; }
  form { display: grid; gap: 1.2rem; }
  fieldset {
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-left: 6px solid var(--verde);
    border-radius: 12px;
    padding: 1rem 1.2rem 1.2rem;
    margin: 0;
    box-shadow: 0 2px 8px rgba(27, 67, 50, .08);
  }
  fieldset:nth-of-type(2) { border-left-color: var(--azul); }
  fieldset:nth-of-type(3) { border-left-color: #e9a820; }
  fieldset:nth-of-type(4) { border-left-color: var(--tierra); }
  fieldset:nth-of-type(5) { border-left-color: #6a994e; }
  legend {
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--verde-oscuro);
    padding: 0 .5rem;
  }
  .campo { margin-top: .9rem; }
  label { display: block; font-weight: 600; margin-bottom: .3rem; }
  select, input[type="number"] {
    width: 100%;
    padding: .65rem .75rem;
    font-size: 1rem;
    border: 1.5px solid var(--borde);
    border-radius: 8px;
    background: #fbfefb;
    color: var(--texto);
  }
  select:focus, input:focus {
    outline: none;
    border-color: var(--verde);
    box-shadow: 0 0 0 3px rgba(45, 106, 79, .2);
  }
  button {
    width: 100%;
    padding: .95rem 1rem;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--blanco);
    background: linear-gradient(135deg, var(--verde), var(--verde-oscuro));
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .1s, filter .2s;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:active:not(:disabled) { transform: scale(.98); }
  button:disabled { background: #8fa89a; cursor: not-allowed; }
  #estado {
    margin-top: 1.2rem;
    text-align: center;
    font-weight: 600;
    color: var(--verde);
    min-height: 1.5rem;
  }
  #estado.error { color: #b3261e; }
  #resultado {
    display: none;
    margin-top: 1rem;
    background: var(--blanco);
    border: 2px solid var(--verde-claro);
    border-radius: 12px;
    padding: 1.2rem 1.4rem;
    white-space: pre-line;
    font-size: 1.05rem;
    box-shadow: 0 2px 10px rgba(27, 67, 50, .1);
  }
  footer { text-align: center; padding: 1rem; font-size: .85rem; color: #52695b; }
  @media (min-width: 600px) {
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  }
</style>
</head>
<body>

<header>
  <span class="icono" aria-hidden="true">🌍</span>
  <h1>Calculadora de huella ecológica</h1>
  <p>Si todos vivieran como tú, ¿cuántos planetas Tierra harían falta? Responde el cuestionario y descúbrelo.</p>
</header>

<main>
  <form id="formulario" novalidate>

    <fieldset>
      <legend>🥗 Alimentación</legend>
      <div class="campo">
        <label for="carne">¿Cada cuánto comes carne de res o cerdo?</label>
        <select id="carne" name="carne" required>
          <option value="Nunca">Nunca</option>
          <option value="1-2 veces por semana">1-2 veces por semana</option>
          <option value="3-5 veces por semana">3-5 veces por semana</option>
          <option value="Diario">Diario</option>
        </select>
      </div>
      <div class="campo">
        <label for="local">¿Qué parte de tu comida es local o de temporada?</label>
        <select id="local" name="local" required>
          <option value="Casi nada">Casi nada</option>
          <option value="La mitad">La mitad</option>
          <option value="Casi toda">Casi toda</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>🚗 Transporte</legend>
      <div class="campo">
        <label for="transporte">Medio de transporte principal</label>
        <select id="transporte" name="transporte" required>
          <option value="Caminar o bicicleta">Caminar o bicicleta</option>
          <option value="Camión urbano">Camión urbano</option>
          <option value="Moto">Moto</option>
          <option value="Auto propio">Auto propio</option>
        </select>
      </div>
      <div class="fila">
        <div class="campo">
          <label for="km">Kilómetros que recorres al día</label>
          <input type="number" id="km" name="km" min="0" step="any" value="0" required>
        </div>
        <div class="campo">
          <label for="vuelos">Vuelos en avión al año</label>
          <input type="number" id="vuelos" name="vuelos" min="0" step="1" value="0" required>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>⚡ Energía</legend>
      <div class="fila">
        <div class="campo">
          <label for="aire">Horas al día de aire acondicionado en casa</label>
          <input type="number" id="aire" name="aire" min="0" max="24" step="any" value="0" required>
        </div>
        <div class="campo">
          <label for="personas">Personas que viven en tu casa</label>
          <input type="number" id="personas" name="personas" min="1" step="1" value="1" required>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>🛍️ Consumo</legend>
      <div class="fila">
        <div class="campo">
          <label for="ropa">Prendas nuevas que compras al mes</label>
          <input type="number" id="ropa" name="ropa" min="0" step="1" value="0" required>
        </div>
        <div class="campo">
          <label for="celular">Cada cuántos años cambias de celular</label>
          <input type="number" id="celular" name="celular" min="1" step="any" value="2" required>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>♻️ Residuos</legend>
      <div class="campo">
        <label for="separa">¿Separas la basura?</label>
        <select id="separa" name="separa" required>
          <option value="Sí">Sí</option>
          <option value="A veces">A veces</option>
          <option value="No">No</option>
        </select>
      </div>
    </fieldset>

    <button type="submit" id="btnCalcular">Calcular mi huella</button>
  </form>

  <div id="estado" role="status" aria-live="polite"></div>
  <div id="resultado"></div>
</main>

<footer>Cada pequeño cambio cuenta para cuidar el planeta 🌱</footer>

<script>
  // Pega aquí la URL del webhook de Make (módulo "Custom webhook"):
  const WEBHOOK_URL = "https://hook.eu1.make.com/txp1j4w9ea7q38sgrg1gvxdbn6jrxkan";

  const formulario = document.getElementById("formulario");
  const boton = document.getElementById("btnCalcular");
  const estado = document.getElementById("estado");
  const resultado = document.getElementById("resultado");

  const CAMPOS = ["carne", "local", "transporte", "km", "vuelos", "aire", "personas", "ropa", "celular", "separa"];

  formulario.addEventListener("submit", async function (e) {
    e.preventDefault();

    if (!formulario.checkValidity()) {
      formulario.reportValidity();
      return;
    }

    const datos = new URLSearchParams();
    CAMPOS.forEach(function (nombre) {
      datos.append(nombre, formulario.elements[nombre].value);
    });

    boton.disabled = true;
    estado.className = "";
    estado.textContent = "Calculando tu huella...";
    resultado.style.display = "none";
    resultado.textContent = "";

    try {
      const respuesta = await fetch(WEBHOOK_URL, {
        method: "POST",
        body: datos
      });

      if (!respuesta.ok) {
        throw new Error("Respuesta no válida: " + respuesta.status);
      }

      const texto = await respuesta.text();
      estado.textContent = "";
      resultado.textContent = texto;
      resultado.style.display = "block";
      resultado.scrollIntoView({ behavior: "smooth", block: "nearest" });
    } catch (error) {
      estado.className = "error";
      estado.textContent = "No se pudo calcular, intenta de nuevo.";
    } finally {
      boton.disabled = false;
    }
  });
</script>
</body>
</html>
